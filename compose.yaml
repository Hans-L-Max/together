# Together – self-hosting with Docker Compose.
#
#   cp .env.example .env    # then set APP_URL, APP_KEY and DB_PASSWORD
#   docker compose up -d --build
#
# The app listens on http://localhost:${APP_PORT:-8080}. Put a TLS-terminating
# reverse proxy (Caddy, Traefik, nginx, ...) in front of it for production.

name: together

x-app: &app
  image: ${TOGETHER_APP_IMAGE:-together-app:local}
  restart: unless-stopped
  env_file: .env
  environment: &app-environment
    APP_ENV: ${APP_ENV:-production}
    APP_DEBUG: ${APP_DEBUG:-false}
    LOG_CHANNEL: stderr
    DB_CONNECTION: pgsql
    DB_HOST: db
    DB_PORT: 5432
    DB_DATABASE: ${DB_DATABASE:-together}
    DB_USERNAME: ${DB_USERNAME:-together}
    DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    SESSION_DRIVER: database
    CACHE_STORE: database
    QUEUE_CONNECTION: database
  volumes:
    - storage:/var/www/html/storage
  depends_on:
    db:
      condition: service_healthy

services:
  app:
    <<: *app
    build:
      context: .
      target: app
    environment:
      <<: *app-environment
      RUN_MIGRATIONS: "true"
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/ready"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  web:
    image: ${TOGETHER_WEB_IMAGE:-together-web:local}
    build:
      context: .
      target: web
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - storage:/var/www/html/storage:ro
    depends_on:
      app:
        condition: service_healthy

  queue:
    <<: *app
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--max-time=3600"]
    depends_on:
      app:
        condition: service_healthy

  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      app:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-together}
      POSTGRES_USER: ${DB_USERNAME:-together}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  storage:
  db-data:
